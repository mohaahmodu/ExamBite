{% load static %}

<!DOCTYPE html>
<html>

<head>

<title>Generate Flashcards</title>

<link rel="stylesheet" href="{% static 'css/output.css' %}">

</head>


<body class="bg-slate-950 text-white">


<div class="max-w-md mx-auto mt-20 bg-slate-900 p-8 rounded-3xl">


<h1 class="text-3xl font-bold text-cyan-400 mb-6">
Generate Flashcards
</h1>


<form method="POST">

{% csrf_token %}


<label class="block mb-3 text-gray-300">
Number of Flashcards
</label>


<input 
type="number"
name="amount"
min="1"
max="100"
placeholder="Example: 20"
required
class="w-full bg-slate-800 p-4 rounded-xl mb-6 text-white">



<button
class="w-full bg-emerald-500 hover:bg-emerald-400 text-black font-bold py-3 rounded-xl">

Generate

</button>


</form>


</div>


</body>

</html>
