{% load static %}
<!DOCTYPE html>
<html>
<head>
    <title>Verify OTP</title>
    <link rel="stylesheet" href="{% static 'css/output.css' %}">
</head>

<body class="bg-slate-950 text-white flex items-center justify-center min-h-screen">

<div class="bg-slate-900 p-8 rounded-xl w-full max-w-md">

<h1 class="text-3xl font-bold mb-6 text-center">
Verify Email
</h1>
{% if messages %}
    {% for message in messages %}
        <div class="bg-red-500 text-white p-3 rounded mb-4">
            {{ message }}
        </div>
    {% endfor %}
{% endif %}

<form method="POST">
    {% csrf_token %}

    <input
        type="text"
        name="otp"
        maxlength="6"
        placeholder="Enter 6-digit OTP"
        class="w-full p-4 rounded-lg bg-slate-800 border border-slate-700 mb-6">

    <button
        class="w-full bg-cyan-500 py-4 rounded-lg">
        Verify OTP
    </button>

</form>

</div>

</body>
</html>
