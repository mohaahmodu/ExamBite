{% load static %}
<!DOCTYPE html>
<html>
<head>
    <title>Forgot Password</title>
    <link rel="stylesheet" href="{% static 'css/output.css' %}">
</head>

<body class="bg-slate-950 flex justify-center items-center min-h-screen">

<div class="bg-slate-900 p-8 rounded-xl w-full max-w-md">

<h1 class="text-3xl font-bold text-cyan-400 text-center">
Forgot Password
</h1>

<p class="text-gray-400 text-center mt-2">
Enter your registered email.
</p>

{% if messages %}
    {% for message in messages %}
        <div class="bg-red-500 p-3 rounded mt-4">
            {{ message }}
        </div>
    {% endfor %}
{% endif %}

<form method="POST" class="mt-6">

{% csrf_token %}

<input
type="email"
name="email"
placeholder="Email Address"
required
class="w-full p-4 rounded-lg bg-slate-800 text-white mb-5">

<button
class="w-full bg-cyan-500 py-4 rounded-lg hover:bg-cyan-600">

Send OTP

</button>

</form>

</div>

</body>
</html>
