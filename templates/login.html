{% load static %}
<!DOCTYPE html>
<html lang="en">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Login | NACOS ExamBite</title>

    <link rel="stylesheet" href="{% static 'css/output.css' %}">
    <link rel="stylesheet"
          href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.5.2/css/all.min.css">
</head>

<body class="bg-slate-950 min-h-screen flex items-center justify-center px-4">

<div class="w-full max-w-md bg-slate-900 rounded-2xl shadow-2xl p-8">

    <h1 class="text-3xl font-bold text-cyan-400 text-center">
        NACOS ExamBite
    </h1>

    <p class="text-gray-400 text-center mt-2">
        Welcome back! Login to continue.
    </p>

    {% if messages %}
        {% for message in messages %}
            <div class="mt-4 p-3 rounded-lg
                {% if message.tags == 'error' %}
                    bg-red-500
                {% elif message.tags == 'success' %}
                    bg-green-500
                {% else %}
                    bg-blue-500
                {% endif %}
                text-white">
                {{ message }}
            </div>
        {% endfor %}
    {% endif %}

    <form method="POST" class="mt-6 space-y-5">

        {% csrf_token %}

        <!-- Username -->

        <div>
            <label class="block text-gray-300 mb-2">
                Username or Email
            </label>

            <input
                type="text"
                name="username"
                placeholder="Enter your username or email"
                required
                class="w-full p-4 rounded-lg bg-slate-800 border border-slate-700 text-white focus:outline-none focus:border-cyan-500">
        </div>

        <!-- Password -->

        <div>
            <label class="block text-gray-300 mb-2">
                Password
            </label>

            <div class="relative">

                <input
                    id="password"
                    type="password"
                    name="password"
                    placeholder="Enter your password"
                    required
                    class="w-full p-4 pr-12 rounded-lg bg-slate-800 border border-slate-700 text-white focus:outline-none focus:border-cyan-500">

                <button
                    type="button"
                    onclick="togglePassword()"
                    class="absolute right-4 top-1/2 -translate-y-1/2 text-gray-400 hover:text-cyan-400">

                    <i id="eyeIcon" class="fa-solid fa-eye"></i>

                </button>

            </div>

        </div>

        <!-- Remember -->

        <div class="flex items-center justify-between">

            <label class="flex items-center text-gray-400">

                <input type="checkbox" class="mr-2">

                Remember me

            </label>

            <a href="{% url 'forgot_password' %}"
               class="text-cyan-400 hover:underline">

                Forgot Password?

            </a>

        </div>

        <!-- Button -->

        <button
            type="submit"
            class="w-full bg-cyan-500 hover:bg-cyan-600 transition py-4 rounded-lg font-bold text-white">

            Login

        </button>

    </form>

    <p class="text-center text-gray-400 mt-6">

        Don't have an account?

        <a href="{% url 'register' %}"
           class="text-cyan-400 hover:underline">

            Create one

        </a>

    </p>

</div>

<script>

function togglePassword() {

    let password = document.getElementById("password");
    let eye = document.getElementById("eyeIcon");

    if(password.type === "password"){

        password.type = "text";

        eye.classList.remove("fa-eye");
        eye.classList.add("fa-eye-slash");

    }else{

        password.type = "password";

        eye.classList.remove("fa-eye-slash");
        eye.classList.add("fa-eye");

    }

}

</script>

</body>

</html>
