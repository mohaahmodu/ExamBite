{% load static %}
<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Reset Password | NACOS ExamBite</title>
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.5.2/css/all.min.css">
    <link rel="stylesheet" href="{% static 'css/output.css' %}">
</head>

<body class="bg-slate-950 flex justify-center items-center min-h-screen">

<div class="bg-slate-900 p-8 rounded-xl w-full max-w-md">

<h1 class="text-3xl font-bold text-cyan-400 text-center">
Reset Password
</h1>

<p class="text-gray-400 text-center mt-2">
Create a new password.
</p>

{% if messages %}
    {% for message in messages %}
        <div class="bg-red-500 p-3 rounded mt-4 text-white">
            {{ message }}
        </div>
    {% endfor %}
{% endif %}

<form method="POST" class="mt-6 space-y-5">

{% csrf_token %}

<div class="relative">
    <input
        id="password"
        type="password"
        name="password"
        placeholder="Password"
        required
        class="w-full p-4 pr-12 rounded-lg bg-slate-800 border border-slate-700 text-white">

    <button
        type="button"
        onclick="togglePassword('password', 'eye1')"
        class="absolute right-4 top-1/2 -translate-y-1/2 text-gray-400">

        <i id="eye1" class="fa-solid fa-eye"></i>

    </button>
</div>

<div class="relative">
    <input
        id="confirm_password"
        type="password"
        name="confirm_password"
        placeholder="Confirm Password"
        required
        class="w-full p-4 pr-12 rounded-lg bg-slate-800 border border-slate-700 text-white">

    <button
        type="button"
        onclick="togglePassword('confirm_password', 'eye2')"
        class="absolute right-4 top-1/2 -translate-y-1/2 text-gray-400">

        <i id="eye2" class="fa-solid fa-eye"></i>

    </button>
</div>

<button
type="submit"
class="w-full bg-cyan-500 hover:bg-cyan-600 py-4 rounded-lg text-white font-bold">

Reset Password

</button>

</form>

</div>

<script>
function togglePassword(inputId, eyeId) {

    const input = document.getElementById(inputId);
    const eye = document.getElementById(eyeId);

    if (input.type === "password") {
        input.type = "text";
        eye.classList.remove("fa-eye");
        eye.classList.add("fa-eye-slash");
    } else {
        input.type = "password";
        eye.classList.remove("fa-eye-slash");
        eye.classList.add("fa-eye");
    }

}
</script>

</body>
</html>
