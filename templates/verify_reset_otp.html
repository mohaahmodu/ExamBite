{% load static %}
<!DOCTYPE html>
<html>
<head>
    <title>Verify Reset OTP</title>
    <link rel="stylesheet" href="{% static 'css/output.css' %}">
</head>

<body class="bg-slate-950 flex justify-center items-center min-h-screen">

<div class="bg-slate-900 p-8 rounded-xl w-full max-w-md">

<h1 class="text-3xl text-cyan-400 font-bold text-center">
Verify OTP
</h1>

<p class="text-gray-400 text-center mt-2">
Enter the OTP sent to your email.
</p>

{% if messages %}
    {% for message in messages %}
        <div class="bg-red-500 p-3 rounded mt-4 text-white">
            {{ message }}
        </div>
    {% endfor %}
{% endif %}

<form method="POST" class="mt-6">

{% csrf_token %}

<input
type="text"
name="otp"
maxlength="6"
placeholder="6-digit OTP"
required
class="w-full p-4 rounded-lg bg-slate-800 text-white mb-5">

<button
type="submit"
class="w-full bg-cyan-500 hover:bg-cyan-600 py-4 rounded-lg text-white font-bold">

Verify OTP

</button>

</form>

</div>

</body>
</html>
