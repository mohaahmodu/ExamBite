{% load static %}
<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Create Account | NACOS ExamBite</title>
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.5.2/css/all.min.css">

    <link rel="stylesheet" href="{% static 'css/output.css' %}">
</head>

<body class="bg-slate-950 min-h-screen flex items-center justify-center px-4">

<div class="w-full max-w-md bg-slate-900 rounded-2xl shadow-2xl p-8">

    <h1 class="text-3xl font-bold text-cyan-400 text-center">
        NACOS ExamBite
    </h1>

    <p class="text-gray-400 text-center mt-2">
        Create your student account
    </p>

    {% if messages %}
        {% for message in messages %}
            <div class="mt-4 bg-red-500 text-white p-3 rounded-lg">
                {{ message }}
            </div>
        {% endfor %}
    {% endif %}

    <form method="POST" class="mt-6 space-y-5">
        {% csrf_token %}

        <div>
            <label class="block text-gray-300 mb-2">Full Name</label>
            <input
                type="text"
                name="full_name"
                placeholder="Enter your full name"
                class="w-full p-4 rounded-lg bg-slate-800 border border-slate-700 text-white focus:outline-none focus:border-cyan-500">
        </div>

        <div>
            <label class="block text-gray-300 mb-2">Username</label>
            <input
                type="text"
                name="username"
                placeholder="Choose a username"
                required
                class="w-full p-4 rounded-lg bg-slate-800 border border-slate-700 text-white focus:outline-none focus:border-cyan-500">
        </div>

        <div>
            <label class="block text-gray-300 mb-2">Institution</label>
            <input
                type="text"
                name="institution"
                placeholder="Your school or institution"
                class="w-full p-4 rounded-lg bg-slate-800 border border-slate-700 text-white focus:outline-none focus:border-cyan-500">
        </div>

        <div>
            <label class="block text-gray-300 mb-2">Email Address</label>
            <input
                type="email"
                name="email"
                placeholder="Enter your email"
                required
                class="w-full p-4 rounded-lg bg-slate-800 border border-slate-700 text-white focus:outline-none focus:border-cyan-500">
        </div>

        <div class="relative">
    <input
        id="password"
        type="password"
        name="password"
        placeholder="Password"
        required
        class="w-full p-4 pr-12 rounded-lg bg-slate-800 border border-slate-700 text-white">

    <button
        type="button"
        onclick="togglePassword('password', 'eye1')"
        class="absolute right-4 top-1/2 -translate-y-1/2 text-gray-400">

        <i id="eye1" class="fa-solid fa-eye"></i>

    </button>
</div>

        <div class="relative">
    <input
        id="confirm_password"
        type="password"
        name="confirm_password"
        placeholder="Confirm Password"
        required
        class="w-full p-4 pr-12 rounded-lg bg-slate-800 border border-slate-700 text-white">

    <button
        type="button"
        onclick="togglePassword('confirm_password', 'eye2')"
        class="absolute right-4 top-1/2 -translate-y-1/2 text-gray-400">

        <i id="eye2" class="fa-solid fa-eye"></i>

    </button>
</div>

        <button
            type="submit"
            class="w-full bg-cyan-500 hover:bg-cyan-600 text-white font-bold py-4 rounded-lg transition">
            Create Account
        </button>
    </form>

    <p class="text-center text-gray-400 mt-6">
        Already have an account?
        <a href="{% url 'login' %}" class="text-cyan-400 hover:underline">
            Login
        </a>
    </p>

</div>


<script>
function togglePassword(inputId, eyeId) {

    const input = document.getElementById(inputId);
    const eye = document.getElementById(eyeId);

    if (input.type === "password") {
        input.type = "text";
        eye.classList.remove("fa-eye");
        eye.classList.add("fa-eye-slash");
    } else {
        input.type = "password";
        eye.classList.remove("fa-eye-slash");
        eye.classList.add("fa-eye");
    }

}
</script>

</body>
</html>
